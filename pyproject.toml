[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names carry the documentation; fixtures keep their class docstring but
# not boilerplate on every method.
"tests/**" = ["D100", "D102", "D103", "D105", "D107"]